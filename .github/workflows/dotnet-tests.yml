name: .NET Tests

# Unity非依存ロジック(tests/配下)の単体テストをpush/PRごとに実行する。
# Unity本体のビルドはライセンス認証やSDKの手動取得が必要でCIに向かないため対象外。
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test tests/MagicalGirl.Core.Tests/MagicalGirl.Core.Tests.csproj --configuration Release
